# Render blueprint for Oryvia Pro (staging): PostgreSQL, the API and the website, all on Render. Create it from the Render dashboard: New → Blueprint → this repo.
# No secret is stored here: the database connection string is wired from the Render database below,
# and BETTER_AUTH_SECRET is generated by Render.
databases:
  - name: oryvia-db
    databaseName: oryvia
    user: oryvia
    plan: free # free Render Postgres expires after 30 days; upgrade or move to Neon before then
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: oryvia-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      npm ci --include=dev &&
      npm run db:generate &&
      npm run db:migrate &&
      npm run seed:reference &&
      npm run source:assets &&
      npm run import:apply
    startCommand: npm run start -w @oryvia/api
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oryvia-db
          property: connectionString
      # The public site address (the oryvia-web service below). Change it if Render assigns a different URL.
      - key: PUBLIC_ORIGIN
        value: https://oryvia-web.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_DEV_MANUAL_PAYMENT
        value: "false"
      # Free plan has no background workers; run the job loop inside the API process instead.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"

  # The storefront, account and admin website (Next.js). Browsers only talk to this service;
  # it forwards /api and /media to oryvia-api, so sign-in cookies stay on one site.
  - type: web
    name: oryvia-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @oryvia/web
    startCommand: npm run start -w @oryvia/web
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        value: https://oryvia-api.onrender.com
      # Browsers call this to wake a sleeping API. Read at build time; not a secret.
      - key: NEXT_PUBLIC_API_URL
        value: https://oryvia-api.onrender.com
      - key: PUBLIC_ORIGIN
        value: https://oryvia-web.onrender.com
      - key: ALLOW_INDEXING
        value: "false"
