# Render blueprint for the Oryvia Pro API (staging). Create it from the Render dashboard: New → Blueprint → this repo.
# No secret is stored here: the database connection string is wired from the Render database below,
# and BETTER_AUTH_SECRET is generated by Render.
databases:
  - name: oryvia-db
    databaseName: oryvia
    user: oryvia
    plan: free # free Render Postgres expires after 30 days; upgrade or move to Neon before then
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: oryvia-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      npm ci --include=dev &&
      npm run db:generate &&
      npm run db:migrate &&
      npm run seed:reference &&
      npm run import:apply &&
      npm run source:assets
    startCommand: npm run start -w @oryvia/api
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oryvia-db
          property: connectionString
      # The public site address (Vercel). Change it in the dashboard if Vercel assigns a different domain.
      - key: PUBLIC_ORIGIN
        value: https://oryviacare.vercel.app
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_DEV_MANUAL_PAYMENT
        value: "false"
      # Free plan has no background workers; run the job loop inside the API process instead.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
