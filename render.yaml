# Render blueprint for the Oryvia Pro API (staging). Create it from the Render dashboard: New → Blueprint → this repo.
# Secrets are never stored here: DATABASE_URL and PUBLIC_ORIGIN are entered in the dashboard (sync: false),
# and BETTER_AUTH_SECRET is generated by Render.
services:
  - type: web
    name: oryvia-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      npm ci --include=dev &&
      npm run db:generate &&
      npm run db:migrate &&
      npm run seed:reference &&
      npm run import:apply &&
      npm run source:assets
    startCommand: npm run start -w @oryvia/api
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon *direct* (non-pooled) connection string; migrations need a direct connection
      - key: PUBLIC_ORIGIN
        sync: false # the Vercel site URL, e.g. https://oryviacare.vercel.app
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_DEV_MANUAL_PAYMENT
        value: "false"
      # Free plan has no background workers; run the job loop inside the API process instead.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
